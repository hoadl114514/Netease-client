# 推送 v* 标签时：跑检查、构建 Android APK，并发布到 GitHub Releases。
# 标签名带 alpha / beta / rc 时发布为预发布版本。
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # 目前用 debug 密钥签名（见 android/app/build.gradle.kts），正式版前换成自己的签名。
      - name: Build APKs
        run: |
          flutter build apk --release
          flutter build apk --release --split-per-abi
          mkdir dist
          v="${GITHUB_REF_NAME}"
          cp build/app/outputs/flutter-apk/app-release.apk "dist/netease-client-$v-universal.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "dist/netease-client-$v-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "dist/netease-client-$v-armeabi-v7a.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          generate_release_notes: true

# 推送 v* 标签，或在 Actions 页面手动运行（填版本标签）时：跑检查、构建 Android APK，
# 并发布到 GitHub Releases。手动运行时会在当前分支的最新提交上创建该标签。
# 标签名带 alpha / beta / rc 时发布为预发布版本。
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '版本标签，例如 v0.1.0'
        required: true
      name:
        description: 'Release 标题，留空则用标签名'
        required: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # 正式签名：keystore 和密码放在仓库 Secrets 里。缺任何一项就失败，不发 debug 签名的包。
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for v in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::缺少签名 Secret：$v"; exit 1; fi
          done
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build APKs
        run: |
          flutter build apk --release
          flutter build apk --release --split-per-abi
          mkdir dist
          v="${TAG}"
          cp build/app/outputs/flutter-apk/app-release.apk "dist/x-music-$v-universal.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "dist/x-music-$v-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "dist/x-music-$v-armeabi-v7a.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)

      # 确认产物不是 debug 签名。
      - name: Verify signature
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for f in dist/*.apk; do
            out=$("$apksigner" verify --print-certs "$f")
            echo "$out" | grep -m1 "certificate DN"
            if echo "$out" | grep -q "CN=Android Debug"; then echo "::error::$f 是 debug 签名"; exit 1; fi
          done

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ inputs.name || env.TAG }}
          # 手动运行时在当前提交上建标签；推标签触发时标签已存在，这项不起作用。
          target_commitish: ${{ github.sha }}
          files: dist/*
          prerelease: ${{ contains(env.TAG, 'alpha') || contains(env.TAG, 'beta') || contains(env.TAG, 'rc') }}
          generate_release_notes: true

# 每次推送到分支和每个 PR：跑检查、构建 Android APK，作为构建产物上传（保留 14 天）。
# 在 Actions 页面对应的运行里下载 x-music-apk。也可以在 Actions 页面手动触发。
name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Build APKs
        run: |
          flutter build apk --release --split-per-abi
          mkdir dist
          sha=$(git rev-parse --short HEAD)
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "dist/x-music-$sha-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "dist/x-music-$sha-armeabi-v7a.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: x-music-apk
          path: dist/*.apk
          retention-days: 14
